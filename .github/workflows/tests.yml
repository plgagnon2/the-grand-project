name: tests

on:
  push:
  pull_request:

concurrency:                       # a newer push to the same branch / PR cancels the older run
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:                               # every test runs under coverage (settings in .coveragerc)
  COVERAGE_RCFILE: ${{ github.workspace }}/.coveragerc

jobs:
  # tests that need no test data: every OS, oldest and newest supported Python
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt coverage
      - name: tests
        run: |
          set -e
          for t in test_atlas_builder test_atlas_io test_model_safety; do
            echo "===== $t"
            python -m coverage run "tests/$t.py"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-offline-${{ matrix.os }}-${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  # the test data (~500 MB in Git LFS) is downloaded once and cached; LFS bandwidth is limited,
  # so the jobs below restore it from the cache instead of each downloading it
  testdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: list the test data files
        run: git lfs ls-files -l -I "atlas_test_data/**" | cut -d' ' -f1 | sort > .lfs-testdata-id
      - uses: actions/cache@v4
        id: cache
        with:
          path: .git/lfs/objects
          key: lfs-testdata-${{ hashFiles('.lfs-testdata-id') }}
          enableCrossOsArchive: true
      - name: download the test data
        if: steps.cache.outputs.cache-hit != 'true'
        run: git lfs fetch --include="atlas_test_data/**" --exclude=""

  # regression tests on the real screenshots: detection, placement, false merges, atlas folders
  regression:
    needs: testdata
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: list the test data files
        run: git lfs ls-files -l -I "atlas_test_data/**" | cut -d' ' -f1 | sort > .lfs-testdata-id
      - uses: actions/cache/restore@v4
        with:
          path: .git/lfs/objects
          key: lfs-testdata-${{ hashFiles('.lfs-testdata-id') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: put the test data in place
        run: |
          git lfs install --local
          git lfs checkout atlas_test_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt coverage
      - name: tests
        run: |
          set -e
          for t in test_atlas_folder test_random_sequence test_drop_placement test_false_merge test_detect_pairs; do
            echo "===== $t"
            python -m coverage run "tests/$t.py"
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-regression-${{ matrix.os }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore

  # the real viewer window on a virtual screen: render, zoom, pan, select, search, bookmarks, adding
  viewer:
    needs: testdata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: list the test data files
        run: git lfs ls-files -l -I "atlas_test_data/**" | cut -d' ' -f1 | sort > .lfs-testdata-id
      - uses: actions/cache/restore@v4
        with:
          path: .git/lfs/objects
          key: lfs-testdata-${{ hashFiles('.lfs-testdata-id') }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: put the test data in place
        run: |
          git lfs install --local
          git lfs checkout atlas_test_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: python -m pip install -r requirements.txt coverage
      - name: viewer test
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m coverage run tests/test_atlas_viewer.py --out "$RUNNER_TEMP/grabs"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-viewer
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: ignore
      - name: keep the window grabs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-window-grabs
          path: ${{ runner.temp }}/grabs
          if-no-files-found: ignore

  # one coverage report from all the jobs above: table on the run's summary page, HTML report as a
  # download, and a comment on pull requests (total and the lines the PR changed)
  coverage:
    needs: [offline, regression, viewer]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write              # the comment action keeps the main branch's coverage for comparison
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install coverage
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: combine
        run: |
          python -m coverage combine
          echo "## Code coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report
          python -m coverage html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: htmlcov
      - name: coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
      # pull requests from forks cannot comment from here (read-only token): the comment is handed
      # to coverage-comment.yml, which posts it
      - uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
